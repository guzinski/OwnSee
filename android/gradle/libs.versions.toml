[versions]
agp = "9.5.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
media3 = "1.11.1"
zxingEmbedded = "4.3.0"

[libraries]
