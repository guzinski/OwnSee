<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e13" />
  <title>Camera Hub</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Camera Hub</h1>
    <div class="actions">
      <label class="toggle">
        <input type="checkbox" id="quality" />
        <span>HD (main stream)</span>
      </label>
      <span id="status" class="status" aria-live="polite"></span>
      <button type="button" id="devices-btn" class="pb-btn">Devices</button>
    </div>
  </header>
  <main id="grid" class="grid" aria-busy="true"></main>

  <dialog id="viewer" class="viewer">
    <button class="close" id="close" aria-label="Close">✕</button>
    <div class="viewer-tabs">
      <button class="tab active" id="tab-live" data-mode="live">Live</button>
      <button class="tab" id="tab-playback" data-mode="playback">Playback</button>
      <span class="viewer-label" id="viewer-label"></span>
      <button class="tab fs-btn" id="fullscreen" aria-label="Fullscreen" title="Fullscreen">⛶</button>
    </div>
    <div id="viewer-mount" class="viewer-mount"></div>
    <div id="playback-controls" class="playback-controls" hidden>
      <div class="pb-row">
        <button type="button" id="pb-prev" class="pb-btn" aria-label="Previous day">◀</button>
        <input id="pb-date" class="pb-date" inputmode="numeric" maxlength="10"
               placeholder="YYYY-MM-DD" pattern="\d{4}-\d{2}-\d{2}" aria-label="Date (YYYY-MM-DD)" />
        <button type="button" id="pb-next" class="pb-btn" aria-label="Next day">▶</button>
      </div>
      <div class="pb-row">
        <select id="pb-hour" class="pb-select" aria-label="Hour"></select>
        <span class="pb-colon">:</span>
        <select id="pb-minute" class="pb-select" aria-label="Minute"></select>
        <button type="button" id="pb-play" class="pb-btn pb-play">Play</button>
        <span id="pb-status" class="status"></span>
      </div>
    </div>
  </dialog>

  <dialog id="devices" class="devices">
    <button class="close" id="devices-close" aria-label="Close">✕</button>
    <h2>Paired phones</h2>
    <p class="muted">Phones paired here can watch remotely through the hub's HTTPS address.
      Pairing only works on this home network.</p>
    <ul id="device-list" class="device-list"></ul>
    <button type="button" id="pair-btn" class="pb-btn pb-play">Pair a phone</button>
    <div id="pair-box" class="pair-box" hidden>
      <p>In the OwnSee app, tap <b>Scan pairing code</b> and point it at this code.</p>
      <div id="pair-qr" class="pair-qr"></div>
      <p id="pair-info" class="muted"></p>
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
  <script type="module" src="/devices.js"></script>
</body>
</html>
